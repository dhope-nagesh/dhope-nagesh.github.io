<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrowFlow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
    <marker id="arrowSuccess" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <marker id="arrowFail" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="500" fill="#0f172a"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Idempotent Retry Flow with State Machine</text>

  <!-- START Node -->
  <circle cx="80" cy="110" r="30" fill="#6366f1"/>
  <text x="80" y="115" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="bold">START</text>

  <!-- Arrow: Start to Key Check -->
  <line x1="110" y1="110" x2="155" y2="110" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowFlow)"/>
  <text x="132" y="100" text-anchor="middle" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="10">request</text>

  <!-- Key Exists? Decision Diamond -->
  <polygon points="230,70 320,110 230,150 140,110" fill="#0ea5e9"/>
  <text x="230" y="105" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Key</text>
  <text x="230" y="122" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Exists?</text>

  <!-- NO Path: Process Request -->
  <line x1="320" y1="110" x2="375" y2="110" stroke="#10b981" stroke-width="2" marker-end="url(#arrowSuccess)"/>
  <text x="348" y="100" text-anchor="middle" fill="#6ee7b7" font-family="Arial, sans-serif" font-size="12" font-weight="bold">NO</text>

  <rect x="385" y="80" width="130" height="60" rx="10" fill="#10b981"/>
  <text x="450" y="105" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Process</text>
  <text x="450" y="125" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Request</text>

  <!-- Arrow: Process to Store -->
  <line x1="515" y1="110" x2="555" y2="110" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowFlow)"/>

  <rect x="565" y="80" width="120" height="60" rx="10" fill="#f59e0b"/>
  <text x="625" y="105" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Store Key</text>
  <text x="625" y="125" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="bold">+ Result</text>

  <!-- Arrow: Store to Return -->
  <line x1="685" y1="110" x2="715" y2="110" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowFlow)"/>

  <rect x="725" y="85" width="60" height="50" rx="8" fill="#8b5cf6"/>
  <text x="755" y="115" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Return</text>

  <!-- YES Path: Check Status -->
  <line x1="230" y1="150" x2="230" y2="195" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowFail)"/>
  <text x="250" y="175" fill="#fca5a5" font-family="Arial, sans-serif" font-size="12" font-weight="bold">YES</text>

  <!-- Status? Decision Diamond -->
  <polygon points="230,210 310,250 230,290 150,250" fill="#f59e0b"/>
  <text x="230" y="255" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Status?</text>

  <!-- PENDING Path -->
  <line x1="310" y1="235" x2="365" y2="215" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowFlow)"/>

  <rect x="375" y="195" width="110" height="45" rx="8" fill="#fbbf24"/>
  <text x="430" y="223" text-anchor="middle" fill="#1e1e2e" font-family="Arial, sans-serif" font-size="13" font-weight="bold">PENDING</text>

  <line x1="485" y1="218" x2="525" y2="218" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowFlow)"/>

  <rect x="535" y="195" width="110" height="45" rx="8" fill="#0ea5e9"/>
  <text x="590" y="223" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Wait + Retry</text>

  <!-- Loop back arrow from Wait to Start -->
  <path d="M 590 240 L 590 320 L 80 320 L 80 145" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowFlow)"/>
  <text x="335" y="340" text-anchor="middle" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="11">retry with same idempotency key</text>

  <!-- COMPLETED Path -->
  <line x1="310" y1="265" x2="365" y2="285" stroke="#10b981" stroke-width="2" marker-end="url(#arrowSuccess)"/>

  <rect x="375" y="265" width="125" height="45" rx="8" fill="#10b981"/>
  <text x="437" y="293" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="bold">COMPLETED</text>

  <line x1="500" y1="288" x2="540" y2="288" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowFlow)"/>

  <rect x="550" y="265" width="120" height="45" rx="8" fill="#8b5cf6"/>
  <text x="610" y="293" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Return Cached</text>

  <!-- FAILED Path -->
  <line x1="150" y1="250" x2="105" y2="250" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowFail)"/>

  <rect x="50" y="230" width="55" height="40" rx="6" fill="#ef4444"/>
  <text x="77" y="255" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">FAILED</text>

  <line x1="77" y1="270" x2="77" y2="295" stroke="#991b1b" stroke-width="2" marker-end="url(#arrowFail)"/>

  <rect x="45" y="305" width="65" height="40" rx="6" fill="#991b1b"/>
  <text x="77" y="330" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Return Err</text>

  <!-- Legend Box -->
  <rect x="40" y="375" width="720" height="110" rx="10" fill="#1e293b"/>
  <text x="400" y="402" text-anchor="middle" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="15" font-weight="bold">State Transitions and Guarantees</text>

  <!-- PENDING Legend -->
  <rect x="60" y="420" width="18" height="18" rx="3" fill="#fbbf24"/>
  <text x="88" y="434" fill="#fcd34d" font-family="Arial, sans-serif" font-size="12" font-weight="bold">PENDING</text>
  <text x="170" y="434" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Request in progress. Client should wait and retry.</text>

  <!-- COMPLETED Legend -->
  <rect x="60" y="448" width="18" height="18" rx="3" fill="#10b981"/>
  <text x="88" y="462" fill="#6ee7b7" font-family="Arial, sans-serif" font-size="12" font-weight="bold">COMPLETED</text>
  <text x="190" y="462" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Success. Return cached response immediately.</text>

  <!-- Key Insight Box -->
  <rect x="510" y="418" width="230" height="55" rx="8" fill="#064e3b"/>
  <text x="625" y="440" text-anchor="middle" fill="#34d399" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Key Insight</text>
  <text x="625" y="460" text-anchor="middle" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="11">Same key = same result (idempotent)</text>
</svg>