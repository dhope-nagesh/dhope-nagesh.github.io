<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <marker id="arrow3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="550" fill="#0f172a"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Idempotent Notification System Architecture</text>

  <!-- User/Client Box -->
  <rect x="30" y="80" width="100" height="70" rx="8" fill="#6366f1"/>
  <text x="80" y="110" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">User</text>
  <text x="80" y="128" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Action</text>

  <!-- Event Producer -->
  <rect x="180" y="80" width="120" height="70" rx="8" fill="#8b5cf6"/>
  <text x="240" y="110" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Event</text>
  <text x="240" y="128" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Producer</text>

  <!-- Message Queue -->
  <rect x="350" y="70" width="140" height="90" rx="8" fill="#0ea5e9"/>
  <text x="420" y="100" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Message Queue</text>
  <text x="420" y="118" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">(Kafka/RabbitMQ)</text>
  <rect x="360" y="130" width="120" height="20" rx="4" fill="#075985"/>
  <text x="420" y="144" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="9">event_id: uuid</text>

  <!-- Notification Service -->
  <rect x="540" y="80" width="130" height="70" rx="8" fill="#10b981"/>
  <text x="605" y="105" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Notification</text>
  <text x="605" y="123" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Service</text>
  <text x="605" y="142" text-anchor="middle" fill="#d1fae5" font-family="monospace" font-size="9">(Consumer)</text>

  <!-- Idempotency Store -->
  <rect x="540" y="200" width="130" height="70" rx="8" fill="#f59e0b"/>
  <text x="605" y="225" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Idempotency</text>
  <text x="605" y="243" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Store</text>
  <text x="605" y="260" text-anchor="middle" fill="#fef3c7" font-family="monospace" font-size="9">(Redis/DB)</text>

  <!-- Email Provider -->
  <rect x="750" y="60" width="110" height="50" rx="8" fill="#ec4899"/>
  <text x="805" y="90" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Email</text>

  <!-- SMS Provider -->
  <rect x="750" y="120" width="110" height="50" rx="8" fill="#8b5cf6"/>
  <text x="805" y="150" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">SMS</text>

  <!-- Push Provider -->
  <rect x="750" y="180" width="110" height="50" rx="8" fill="#06b6d4"/>
  <text x="805" y="210" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Push</text>

  <!-- Arrows -->
  <line x1="130" y1="115" x2="170" y2="115" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow1)"/>
  <line x1="300" y1="115" x2="340" y2="115" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow1)"/>
  <line x1="490" y1="115" x2="530" y2="115" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="670" y1="95" x2="740" y2="85" stroke="#10b981" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="670" y1="115" x2="740" y2="145" stroke="#10b981" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="670" y1="135" x2="740" y2="195" stroke="#10b981" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Idempotency check arrow -->
  <line x1="605" y1="150" x2="605" y2="190" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow1)"/>
  <text x="620" y="175" fill="#fcd34d" font-family="monospace" font-size="9">check/store</text>

  <!-- Flow explanation box -->
  <rect x="30" y="310" width="840" height="220" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="450" y="335" text-anchor="middle" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Idempotency Flow</text>

  <!-- Step 1 -->
  <circle cx="60" cy="370" r="15" fill="#6366f1"/>
  <text x="60" y="375" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">1</text>
  <text x="85" y="375" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">Event arrives with unique event_id (e.g., order_created_12345)</text>

  <!-- Step 2 -->
  <circle cx="60" cy="410" r="15" fill="#10b981"/>
  <text x="60" y="415" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">2</text>
  <text x="85" y="415" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">Notification service checks: "Have I processed event_id before?"</text>

  <!-- Step 3 -->
  <circle cx="60" cy="450" r="15" fill="#f59e0b"/>
  <text x="60" y="455" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">3</text>
  <text x="85" y="455" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">If NOT found: Process notification, store event_id with TTL</text>

  <!-- Step 4 -->
  <circle cx="60" cy="490" r="15" fill="#ef4444"/>
  <text x="60" y="495" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">4</text>
  <text x="85" y="495" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">If FOUND: Skip processing (duplicate detected) - prevents double emails!</text>

  <!-- Benefit box -->
  <rect x="500" y="360" width="350" height="80" rx="6" fill="#064e3b"/>
  <text x="675" y="385" text-anchor="middle" fill="#34d399" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Why This Matters</text>
  <text x="520" y="405" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="11">Network failures, queue redeliveries, and</text>
  <text x="520" y="422" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="11">consumer crashes can cause duplicate messages.</text>
  <text x="520" y="439" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="11">Idempotency ensures users get exactly ONE notification.</text>
</svg>