<svg xmlns="http://www.w3.org/2000/svg" width="950" height="750" viewBox="0 0 950 750" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrowBank" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="950" height="750" fill="#0f172a"/>

  <!-- Title -->
  <text x="475" y="35" text-anchor="middle" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Idempotent Banking Transaction System</text>

  <!-- ==================== WITHOUT IDEMPOTENCY SECTION ==================== -->
  <rect x="30" y="60" width="430" height="220" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="245" y="90" text-anchor="middle" fill="#ef4444" font-family="Arial, sans-serif" font-size="16" font-weight="bold">WITHOUT Idempotency</text>

  <!-- Components -->
  <rect x="50" y="110" width="80" height="45" rx="6" fill="#6366f1"/>
  <text x="90" y="138" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Client</text>

  <rect x="200" y="110" width="100" height="45" rx="6" fill="#10b981"/>
  <text x="250" y="138" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Bank API</text>

  <ellipse cx="380" cy="132" rx="55" ry="28" fill="#f59e0b"/>
  <text x="380" y="137" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Account</text>

  <!-- First Request -->
  <line x1="130" y1="125" x2="190" y2="125" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowBank)"/>
  <text x="160" y="118" text-anchor="middle" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="10">$100</text>

  <line x1="300" y1="125" x2="320" y2="125" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="312" y="118" text-anchor="middle" fill="#6ee7b7" font-family="Arial, sans-serif" font-size="9">-$100</text>

  <!-- Timeout -->
  <path d="M 200 155 Q 160 170 130 155" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowRed)"/>
  <text x="165" y="185" text-anchor="middle" fill="#fca5a5" font-family="Arial, sans-serif" font-size="11" font-weight="bold">TIMEOUT!</text>

  <!-- Retry Request -->
  <line x1="130" y1="205" x2="190" y2="205" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowBank)"/>
  <text x="160" y="198" text-anchor="middle" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="10">Retry $100</text>

  <line x1="300" y1="205" x2="320" y2="205" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="312" y="198" text-anchor="middle" fill="#fca5a5" font-family="Arial, sans-serif" font-size="9">-$100</text>

  <!-- Warning Box -->
  <rect x="50" y="235" width="390" height="35" rx="6" fill="#7f1d1d"/>
  <text x="245" y="258" text-anchor="middle" fill="#fca5a5" font-family="Arial, sans-serif" font-size="13" font-weight="bold">DOUBLE CHARGE! $200 deducted instead of $100</text>

  <!-- ==================== WITH IDEMPOTENCY SECTION ==================== -->
  <rect x="490" y="60" width="430" height="220" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="705" y="90" text-anchor="middle" fill="#10b981" font-family="Arial, sans-serif" font-size="16" font-weight="bold">WITH Idempotency</text>

  <!-- Components -->
  <rect x="510" y="110" width="80" height="45" rx="6" fill="#6366f1"/>
  <text x="550" y="138" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Client</text>

  <rect x="660" y="110" width="100" height="45" rx="6" fill="#10b981"/>
  <text x="710" y="138" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Bank API</text>

  <ellipse cx="840" cy="132" rx="55" ry="28" fill="#f59e0b"/>
  <text x="840" y="137" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Account</text>

  <!-- First Request with Key -->
  <line x1="590" y1="120" x2="650" y2="120" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowBank)"/>
  <text x="620" y="112" text-anchor="middle" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="9">key:abc + $100</text>

  <line x1="760" y1="125" x2="780" y2="125" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="772" y="118" text-anchor="middle" fill="#6ee7b7" font-family="Arial, sans-serif" font-size="9">-$100</text>

  <!-- Timeout -->
  <path d="M 660 155 Q 620 170 590 155" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowRed)"/>
  <text x="625" y="185" text-anchor="middle" fill="#fca5a5" font-family="Arial, sans-serif" font-size="11" font-weight="bold">TIMEOUT!</text>

  <!-- Retry with Same Key -->
  <line x1="590" y1="205" x2="650" y2="205" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowBank)"/>
  <text x="620" y="198" text-anchor="middle" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="9">key:abc (retry)</text>

  <!-- Return Cached -->
  <path d="M 660 215 Q 620 225 590 215" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="625" y="240" text-anchor="middle" fill="#6ee7b7" font-family="Arial, sans-serif" font-size="10">Cached OK</text>

  <!-- Success Box -->
  <rect x="510" y="252" width="390" height="25" rx="6" fill="#064e3b"/>
  <text x="705" y="270" text-anchor="middle" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Only $100 deducted - duplicate safely ignored</text>

  <!-- ==================== ARCHITECTURE DIAGRAM ==================== -->
  <rect x="30" y="300" width="890" height="430" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="475" y="335" text-anchor="middle" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Complete Banking Idempotency Architecture</text>

  <!-- Mobile App -->
  <rect x="60" y="370" width="100" height="65" rx="8" fill="#6366f1"/>
  <text x="110" y="400" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Mobile</text>
  <text x="110" y="418" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="bold">App</text>

  <!-- API Gateway -->
  <rect x="220" y="370" width="110" height="65" rx="8" fill="#0ea5e9"/>
  <text x="275" y="400" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="bold">API</text>
  <text x="275" y="418" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Gateway</text>

  <!-- Transaction Service -->
  <rect x="390" y="370" width="130" height="65" rx="8" fill="#10b981"/>
  <text x="455" y="400" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Transaction</text>
  <text x="455" y="418" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Service</text>

  <!-- Core Banking -->
  <rect x="580" y="370" width="130" height="65" rx="8" fill="#8b5cf6"/>
  <text x="645" y="400" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Core</text>
  <text x="645" y="418" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Banking</text>

  <!-- Account Ledger -->
  <ellipse cx="810" cy="402" rx="70" ry="35" fill="#f59e0b"/>
  <text x="810" y="398" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Account</text>
  <text x="810" y="415" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Ledger</text>

  <!-- Idempotency Store -->
  <rect x="390" y="480" width="130" height="55" rx="8" fill="#f59e0b"/>
  <text x="455" y="503" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Idempotency</text>
  <text x="455" y="520" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Store (Redis)</text>

  <!-- Audit Log -->
  <rect x="580" y="480" width="110" height="55" rx="8" fill="#ec4899"/>
  <text x="635" y="503" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Audit</text>
  <text x="635" y="520" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Log</text>

  <!-- Arrows between components -->
  <line x1="160" y1="402" x2="210" y2="402" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowBank)"/>
  <line x1="330" y1="402" x2="380" y2="402" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowBank)"/>
  <line x1="520" y1="402" x2="570" y2="402" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="710" y1="402" x2="735" y2="402" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowBank)"/>

  <!-- Vertical arrows -->
  <line x1="455" y1="435" x2="455" y2="470" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <line x1="645" y1="435" x2="635" y2="470" stroke="#ec4899" stroke-width="2" marker-end="url(#arrowBank)"/>

  <!-- Labels for arrows -->
  <text x="185" y="392" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="10">request +</text>
  <text x="185" y="404" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="10">idem-key</text>
  <text x="355" y="395" fill="#7dd3fc" font-family="Arial, sans-serif" font-size="10">validate</text>
  <text x="545" y="395" fill="#6ee7b7" font-family="Arial, sans-serif" font-size="10">debit</text>
  <text x="725" y="395" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="10">persist</text>
  <text x="470" y="455" fill="#fcd34d" font-family="Arial, sans-serif" font-size="10">check/store</text>
  <text x="660" y="455" fill="#f9a8d4" font-family="Arial, sans-serif" font-size="10">log</text>

  <!-- ==================== BOTTOM INFO BOXES ==================== -->

  <!-- Key Generation Box -->
  <rect x="50" y="560" width="260" height="150" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="2"/>
  <text x="180" y="588" text-anchor="middle" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Idempotency Key Generation</text>
  <text x="65" y="615" fill="#94a3b8" font-family="monospace" font-size="11">// Deterministic key</text>
  <text x="65" y="638" fill="#fcd34d" font-family="monospace" font-size="11">key = hash(</text>
  <text x="80" y="658" fill="#a5b4fc" font-family="monospace" font-size="11">user_id +</text>
  <text x="80" y="678" fill="#a5b4fc" font-family="monospace" font-size="11">account_id +</text>
  <text x="80" y="698" fill="#a5b4fc" font-family="monospace" font-size="11">amount + timestamp</text>
  <text x="65" y="718" fill="#fcd34d" font-family="monospace" font-size="11">)</text>

  <!-- Transaction States Box -->
  <rect x="340" y="560" width="260" height="150" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="470" y="588" text-anchor="middle" fill="#6ee7b7" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Transaction States</text>

  <circle cx="365" cy="618" r="8" fill="#fbbf24"/>
  <text x="385" y="623" fill="#fcd34d" font-family="Arial, sans-serif" font-size="12" font-weight="bold">PENDING</text>
  <text x="470" y="623" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">In progress</text>

  <circle cx="365" cy="653" r="8" fill="#10b981"/>
  <text x="385" y="658" fill="#4ade80" font-family="Arial, sans-serif" font-size="12" font-weight="bold">COMPLETED</text>
  <text x="490" y="658" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">Success</text>

  <circle cx="365" cy="688" r="8" fill="#ef4444"/>
  <text x="385" y="693" fill="#f87171" font-family="Arial, sans-serif" font-size="12" font-weight="bold">FAILED</text>
  <text x="450" y="693" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">Error occurred</text>

  <!-- Benefits Box -->
  <rect x="630" y="560" width="280" height="150" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="770" y="588" text-anchor="middle" fill="#fcd34d" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Critical Benefits</text>

  <text x="650" y="618" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="12">&#10003; No double charges</text>
  <text x="650" y="648" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="12">&#10003; Safe retry after timeout</text>
  <text x="650" y="678" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="12">&#10003; Complete audit trail</text>
  <text x="650" y="708" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="12">&#10003; Network failure resilience</text>
</svg>