<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}Nagesh Dhope</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncatewords: 30 }}">
    <meta name="author" content="Nagesh Dhope">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <!-- Open Graph -->
    <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}Nagesh Dhope">
    <meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | truncatewords: 30 }}">
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/assets/photo.jpeg' | absolute_url }}">
    <meta property="og:site_name" content="Nagesh Dhope">
    {% if page.layout == 'post' %}
    <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
    {% for tag in page.tags %}<meta property="article:tag" content="{{ tag }}">
    {% endfor %}{% endif %}
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% if page.title %}{{ page.title }} | {% endif %}Nagesh Dhope">
    <meta name="twitter:description" content="{{ page.excerpt | default: site.description | strip_html | truncatewords: 30 }}">
    <meta name="twitter:image" content="{{ '/assets/photo.jpeg' | absolute_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
    <link rel="alternate" type="application/rss+xml" title="Nagesh Dhope's Blog" href="{{ '/feed.xml' | absolute_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/styles.css?v=2.3' | relative_url }}">
    <script>
        (function() {
            var theme = localStorage.getItem('theme') || 'light';
            var palette = localStorage.getItem('palette') || 'indigo';
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.setAttribute('data-palette', palette);
        })();
    </script>
    {% if page.layout == 'post' %}
    <!-- Structured Data: BlogPosting -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "BlogPosting",
        "headline": "{{ page.title | escape }}",
        "description": "{{ page.excerpt | strip_html | truncatewords: 30 | escape }}",
        "image": "{{ '/assets/photo.jpeg' | absolute_url }}",
        "datePublished": "{{ page.date | date_to_xmlschema }}",
        "dateModified": "{{ page.date | date_to_xmlschema }}",
        "url": "{{ page.url | absolute_url }}",
        "mainEntityOfPage": {
            "@type": "WebPage",
            "@id": "{{ page.url | absolute_url }}"
        },
        "author": {
            "@type": "Person",
            "name": "Nagesh Dhope",
            "url": "https://nageshdhope.me"
        },
        "publisher": {
            "@type": "Person",
            "name": "Nagesh Dhope",
            "url": "https://nageshdhope.me"
        }{% if page.tags.size > 0 %},
        "keywords": "{{ page.tags | join: ', ' }}"{% endif %}
    }
    </script>
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
            {
                "@type": "ListItem",
                "position": 1,
                "name": "Home",
                "item": "https://nageshdhope.me/"
            },
            {
                "@type": "ListItem",
                "position": 2,
                "name": "Blog",
                "item": "https://nageshdhope.me/blog/"
            },
            {
                "@type": "ListItem",
                "position": 3,
                "name": "{{ page.title | escape }}",
                "item": "{{ page.url | absolute_url }}"
            }
        ]
    }
    </script>
    {% endif %}
</head>
<body>
    <div id="readingProgressBar" class="reading-progress-bar"></div>
    <nav class="blog-nav" id="navbar">
        <div class="nav-container">
            <a href="{{ '/' | relative_url }}" class="nav-logo"><img src="{{ '/assets/photo.jpeg' | relative_url }}" alt="Nagesh Dhope"></a>
            <div class="blog-nav-links">
                <a href="{{ '/' | relative_url }}" class="nav-link">Portfolio</a>
                <a href="{{ '/blog' | relative_url }}" class="nav-link">Blogs</a>
            </div>
            <div class="nav-actions">
                <div class="palette-dropdown" id="paletteDropdown">
                    <button class="palette-toggle" id="paletteToggle" aria-label="Change color palette" aria-expanded="false" title="Change color palette">
                        <svg class="icon-palette" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="13.5" cy="6.5" r=".5" fill="currentColor" />
                            <circle cx="17.5" cy="10.5" r=".5" fill="currentColor" />
                            <circle cx="8.5" cy="7.5" r=".5" fill="currentColor" />
                            <circle cx="6.5" cy="12.5" r=".5" fill="currentColor" />
                            <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z" />
                        </svg>
                    </button>
                    <div class="palette-menu" id="paletteMenu" role="menu">
                        <div class="palette-menu-header">Color Palette</div>
                        <button class="palette-option active" data-palette-val="indigo" role="menuitem">
                            <span class="palette-swatch swatch-indigo"></span>
                            <span class="palette-name">Indigo Aurora</span>
                            <svg class="palette-check" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                        </button>
                        <button class="palette-option" data-palette-val="emerald" role="menuitem">
                            <span class="palette-swatch swatch-emerald"></span>
                            <span class="palette-name">Terminal Emerald</span>
                            <svg class="palette-check" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                        </button>
                        <button class="palette-option" data-palette-val="oceanic" role="menuitem">
                            <span class="palette-swatch swatch-oceanic"></span>
                            <span class="palette-name">Deep Oceanic</span>
                            <svg class="palette-check" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                        </button>
                        <button class="palette-option" data-palette-val="amber" role="menuitem">
                            <span class="palette-swatch swatch-amber"></span>
                            <span class="palette-name">Warm Editorial</span>
                            <svg class="palette-check" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                        </button>
                        <button class="palette-option" data-palette-val="violet" role="menuitem">
                            <span class="palette-swatch swatch-violet"></span>
                            <span class="palette-name">Cyber Violet</span>
                            <svg class="palette-check" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                        </button>
                        <button class="palette-option" data-palette-val="zinc" role="menuitem">
                            <span class="palette-swatch swatch-zinc"></span>
                            <span class="palette-name">Monochrome Zinc</span>
                            <svg class="palette-check" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                        </button>
                        <button class="palette-option" data-palette-val="nordic" role="menuitem">
                            <span class="palette-swatch swatch-nordic"></span>
                            <span class="palette-name">Nordic Frost</span>
                            <svg class="palette-check" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                        </button>
                    </div>
                </div>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
            </div>
        </div>
    </nav>

    <main class="blog-main">
        {{ content }}
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Nagesh Dhope. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Theme & Palette Initial Setup
        const savedTheme = localStorage.getItem('theme') || 'light';
        const savedPalette = localStorage.getItem('palette') || 'indigo';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.documentElement.setAttribute('data-palette', savedPalette);

        // Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                const current = document.documentElement.getAttribute('data-theme');
                const next = current === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
            });
        }

        // Palette Switcher
        const paletteToggle = document.getElementById('paletteToggle');
        const paletteMenu = document.getElementById('paletteMenu');

        function updateActivePaletteUI(palette) {
            if (!paletteMenu) return;
            paletteMenu.querySelectorAll('.palette-option').forEach(btn => {
                const val = btn.getAttribute('data-palette-val');
                btn.classList.toggle('active', val === palette);
            });
        }

        if (paletteToggle && paletteMenu) {
            updateActivePaletteUI(savedPalette);

            paletteToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = paletteMenu.classList.toggle('open');
                paletteToggle.setAttribute('aria-expanded', isOpen);
            });

            paletteMenu.querySelectorAll('.palette-option').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const chosen = btn.getAttribute('data-palette-val');
                    document.documentElement.setAttribute('data-palette', chosen);
                    localStorage.setItem('palette', chosen);
                    updateActivePaletteUI(chosen);
                    paletteMenu.classList.remove('open');
                    paletteToggle.setAttribute('aria-expanded', 'false');
                });
            });

            document.addEventListener('click', (e) => {
                if (!paletteMenu.contains(e.target) && !paletteToggle.contains(e.target)) {
                    paletteMenu.classList.remove('open');
                    paletteToggle.setAttribute('aria-expanded', 'false');
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && paletteMenu.classList.contains('open')) {
                    paletteMenu.classList.remove('open');
                    paletteToggle.setAttribute('aria-expanded', 'false');
                }
            });
        }

        // Reading progress indicator
        const progressBar = document.getElementById('readingProgressBar');
        window.addEventListener('scroll', () => {
            navbar.classList.toggle('scrolled', window.scrollY > 10);
            if (progressBar) {
                const totalHeight = document.documentElement.scrollHeight - window.innerHeight;
                if (totalHeight > 0) {
                    progressBar.style.width = ((window.scrollY / totalHeight) * 100) + '%';
                }
            }
        });

        // Code copy buttons
        document.querySelectorAll('.blog-post-content pre').forEach(function(pre) {
            var btn = document.createElement('button');
            btn.className = 'code-copy-btn';
            btn.setAttribute('aria-label', 'Copy code');
            btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy';
            btn.addEventListener('click', function() {
                var code = pre.querySelector('code');
                var text = code ? code.textContent : pre.textContent;
                navigator.clipboard.writeText(text).then(function() {
                    btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Copied!';
                    btn.classList.add('copied');
                    setTimeout(function() {
                        btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy';
                        btn.classList.remove('copied');
                    }, 2000);
                });
            });
            pre.appendChild(btn);
        });
    </script>
</body>
</html>
